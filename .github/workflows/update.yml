name: Günlük güncelleme ve yayın

on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (TR saati)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tarih ve Claude talimatı
        id: prep
        run: |
          TODAY=$(TZ=Europe/Istanbul date +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          # Talimat tek yerde duruyor: scraper/claude_prompt.md (yerel çalıştırma da onu kullanıyor)
          {
            echo "prompt<<__PROMPT_EOF__"
            sed "s/{TODAY}/$TODAY/g" scraper/claude_prompt.md
            echo "__PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Claude aboneliği (Pro/Max) ile çalışır, API ücreti yok.
      # Sosyal medya / üniversite / topluluk duyurularını web aramasıyla bulur.
      - name: Claude Code ile sosyal medya taraması
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Write"
          prompt: ${{ steps.prep.outputs.prompt }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testler
        run: python -m unittest discover -s tests -t .

      - name: Etkinlikleri topla
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}  # opsiyonel, Claude yerine/ek olarak
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python -m scraper.run

      - name: Veriyi repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          git diff --cached --quiet || git commit -m "data: günlük güncelleme $TODAY"
          git pull --rebase -X theirs || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
